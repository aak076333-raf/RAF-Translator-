<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RAF Translator</title>

<style>
body{
font-family:Arial;
background:#101820;
color:white;
text-align:center;
padding:20px;
}

textarea{
width:90%;
height:120px;
font-size:20px;
padding:10px;
}

button{
padding:12px 25px;
margin:10px;
font-size:18px;
cursor:pointer;
}

#output{
margin-top:20px;
font-size:24px;
color:#00ff99;
}
</style>

</head>

<body>

<h1>RAF ↔ English Translator</h1>

<textarea id="input" placeholder="Enter text"></textarea>

<br>

<button onclick="englishToRAF()">English → RAF</button>

<button onclick="rafToEnglish()">RAF → English</button>

<div id="output"></div>

<script>

const engToRAF={
A:"0",
B:"1",
C:"2",
D:"3",
E:"4",
F:"5",
G:"6",
H:"7",
I:"8",
J:"9",
K:"√10",
L:"√11",
M:"√12",
N:"√13",
O:"√14",
P:"√15",
Q:"√16",
R:"√17",
S:"√18",
T:"√19",
U:"√20",
V:"√21",
W:"√22",
X:"√23",
Y:"√24",
Z:"√25"
};

const rafToEng={};

for(let key in engToRAF){
rafToEng[engToRAF[key]]=key;
}

function englishToRAF(){

let text=document.getElementById("input").value.toUpperCase();

let out="";

for(let ch of text){

if(engToRAF[ch]){
out+=engToRAF[ch]+" ";
}
else{
out+=ch;
}

}

document.getElementById("output").innerHTML=out;

}

function rafToEnglish(){

let text=document.getElementById("input").value.trim();

let parts=text.split(/\s+/);

let out="";

for(let p of parts){

if(rafToEng[p]){
out+=rafToEng[p];
}
else{
out+=p+" ";
}

}

document.getElementById("output").innerHTML=out;

}

</script>

</body>
</html>
